<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ChurnInsight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, #1e293b 0%, #0f172a 90%);
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            background: #111827;
            padding: 36px 30px 30px;
            text-align: center;
            color: #ffffff;
        }
        .login-logo {
            width: 52px;
            height: 52px;
            background: #2563eb;
            color: #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            margin: 0 auto 16px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4);
        }
        .login-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .login-header p {
            font-size: 13px;
            color: #94a3b8;
        }
        .login-body {
            padding: 32px 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
            color: #0f172a;
        }
        .form-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .login-btn:hover {
            background: #1d4ed8;
        }
        .login-btn:active {
            transform: scale(0.99);
        }
        .login-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .demo-credentials {
            margin-top: 24px;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
        .demo-credentials code {
            color: #1e293b;
            font-weight: 600;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">CI</div>
                <h2>ChurnInsight Portal</h2>
                <p>Enterprise Customer Retention Intelligence</p>
            </div>
            <div class="login-body">
                {% if error %}
                <div class="login-error">
                    {{ error }}
                </div>
                {% endif %}
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="form-group">
                        <label class="form-label" for="username">Admin Username</label>
                        <input class="form-input" type="text" id="username" name="username" value="admin" placeholder="e.g. admin" required autofocus>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-input" type="password" id="password" name="password" value="admin123" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="login-btn">Secure Sign In</button>
                </form>

                <div class="demo-credentials">
                    <strong>Default Credentials:</strong> Username: <code>admin</code> | Password: <code>admin123</code>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
