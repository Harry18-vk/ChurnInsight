<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70" fill="none">
    <defs>
        <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#f0f9ff" />
            <stop offset="100%" stop-color="#38bdf8" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#4facfe" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Icon Mark Container -->
    <g transform="translate(6, 7)">
        <!-- Outer Tech Ring -->
        <rect x="0" y="0" width="56" height="56" rx="16" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="2" filter="url(#glow)"/>
        
        <!-- Retention Loop & Waveform Icon -->
        <!-- Curved Retention Orbit -->
        <path d="M 16 28 A 12 12 0 1 1 28 40" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
        <polygon points="27,44 32,39 27,34" fill="#00f2fe"/>

        <!-- Analytics Pulse / Tech Wave -->
        <path d="M 18 29 L 24 23 L 30 33 L 36 19 L 41 26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Predictive Nodes -->
        <circle cx="24" cy="23" r="2.5" fill="#38bdf8"/>
        <circle cx="36" cy="19" r="3" fill="#00f2fe" filter="url(#glow)"/>
        <circle cx="41" cy="26" r="2" fill="#ffffff"/>
    </g>

    <!-- Typography -->
    <!-- Brand Name: ChurnInsight -->
    <text x="76" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
        Churn<tspan fill="url(#accentGrad)">Insight</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="78" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1.8">
        INTELLIGENCE PLATFORM
    </text>
</svg>
